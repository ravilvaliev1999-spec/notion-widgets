name: Apply create reconciliation hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-create-reconciliation-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          index_path = Path('widget-v20/Index.html')
          index = index_path.read_text()

          index = replace_once(index,
          """  const completedCreateAnnouncements = new Map();
  const recentDrivePageIds = new Set();
  const urgentDriveTargets = new Set();""",
          """  const completedCreateAnnouncements = new Map();
  const recentDrivePageIds = new Set();
  const recentDriveRenameWatches = new Map();
  let recentDriveRenameTimer = 0;
  const urgentDriveTargets = new Set();""",
          'drive rename watch state')

          index = replace_once(index,
          """      const item=state.materials.find((candidate)=>candidate.id===pageId&&candidate.googleFileId===update.googleFileId);
      if(!item)return;
      ['name','section','format','openUrl','mimeType','size','driveMd5','downloadName','normalizedUrl','drivePollClaim'].forEach((key)=>{""",
          """      const item=state.materials.find((candidate)=>candidate.id===pageId&&candidate.googleFileId===update.googleFileId);
      if(!item)return;
      const renameWatch=recentDriveRenameWatches.get(pageId),nextName=Object.prototype.hasOwnProperty.call(update,'name')?String(update.name||''):'';
      if(renameWatch&&nextName&&nextName!==renameWatch.initialName){recentDriveRenameWatches.delete(pageId);recentDrivePageIds.delete(pageId);urgentDriveTargets.delete(pageId);}
      ['name','section','format','openUrl','mimeType','size','driveMd5','downloadName','normalizedUrl','drivePollClaim'].forEach((key)=>{""",
          'stop rename watch after observed rename')

          index = replace_once(index,
          """  function pruneDrivePollTargets() {
    const known=new Set(state.materials.map((item)=>normalizeUuid(item&&item.id)).filter(Boolean));
    Array.from(urgentDriveTargets).forEach((id)=>{if(!known.has(id))urgentDriveTargets.delete(id);});
    Array.from(recentDrivePageIds).forEach((id)=>{if(!known.has(id))recentDrivePageIds.delete(id);});
  }

  function scheduleUrgentDriveRetry() {""",
          """  function pruneDrivePollTargets() {
    const known=new Set(state.materials.map((item)=>normalizeUuid(item&&item.id)).filter(Boolean));
    Array.from(urgentDriveTargets).forEach((id)=>{if(!known.has(id))urgentDriveTargets.delete(id);});
    Array.from(recentDrivePageIds).forEach((id)=>{if(!known.has(id))recentDrivePageIds.delete(id);});
    Array.from(recentDriveRenameWatches.keys()).forEach((id)=>{if(!known.has(id))recentDriveRenameWatches.delete(id);});
  }

  function watchCreatedDriveMaterial(material) {
    const pageId=normalizeUuid(material&&material.id);
    if(!pageId||!material.googleFileId)return;
    recentDrivePageIds.add(pageId);
    recentDriveRenameWatches.set(pageId,{initialName:String(material.name||''),until:Date.now()+90000,attempt:0});
    scheduleRecentDriveRenameWatch(250);
  }

  function scheduleRecentDriveRenameWatch(delay) {
    if(recentDriveRenameTimer||!recentDriveRenameWatches.size)return;
    recentDriveRenameTimer=window.setTimeout(async()=>{
      recentDriveRenameTimer=0;
      const now=Date.now(),targets=new Set();
      recentDriveRenameWatches.forEach((record,pageId)=>{
        if(!record||record.until<=now){recentDriveRenameWatches.delete(pageId);recentDrivePageIds.delete(pageId);return;}
        record.attempt=Number(record.attempt||0)+1;targets.add(pageId);
      });
      if(targets.size){try{await pollDriveMetadata(true,targets);}catch(_error){}}
      if(recentDriveRenameWatches.size){
        const maxAttempt=Math.max(...Array.from(recentDriveRenameWatches.values(),(record)=>Number(record.attempt||0)));
        const delays=[500,900,1500,2500,4000,6500,10000,15000];
        scheduleRecentDriveRenameWatch(delays[Math.min(maxAttempt,delays.length-1)]);
      }
    },Math.max(250,Number(delay)||1000));
  }

  function scheduleUrgentDriveRetry() {""",
          'fast rename watcher')

          index = replace_once(index,
          """      if(completed){pendingCreatePolls.delete(requestId);rememberCompletedCreate(requestId);recentDrivePageIds.add(completed.id);return;}""",
          """      if(completed){pendingCreatePolls.delete(requestId);rememberCompletedCreate(requestId);recentDrivePageIds.add(completed.id);watchCreatedDriveMaterial(completed);return;}""",
          'watch recovered create')

          index = replace_once(index,
          """  function scheduleCreateStatus(record) {
    if(!record||record.timer||record.attempts>=16)return;""",
          """  function scheduleCreateStatus(record) {
    if(!record||record.timer)return;""",
          'remove short reconciliation cutoff')

          index = replace_once(index,
          """    upsert(material);if(material){recentCompletedCreates.set(normalized,material);rememberCompletedCreate(normalized);recentDrivePageIds.add(material.id);}
    render();if(announce!==false)announceEmbedBridgeReady();""",
          """    upsert(material);if(material){recentCompletedCreates.set(normalized,material);rememberCompletedCreate(normalized);recentDrivePageIds.add(material.id);}
    if(material)watchCreatedDriveMaterial(material);
    render();if(announce!==false)announceEmbedBridgeReady();""",
          'watch newly completed create')

          index = replace_once(index,
          """  function failOptimisticCreate(requestId,message) {
    const record=pendingCreatePolls.get(String(requestId||'').toLowerCase()),pending=record&&state.materials.find((item)=>item.id===record.pendingId);
    if(pending){pending.syncStatus='error';pending.error=String(message||'Создание не завершилось. Повторите нажатие.').slice(0,500);render();}
    if(record)scheduleCreateStatus(record);
  }""",
          """  function failOptimisticCreate(requestId,message,retryable) {
    const record=pendingCreatePolls.get(String(requestId||'').toLowerCase()),pending=record&&state.materials.find((item)=>item.id===record.pendingId);
    if(pending){
      if(retryable===false){pending.syncStatus='error';pending.error=String(message||'Создание не завершилось. Повторите нажатие.').slice(0,500);}
      else{pending.syncStatus='reconciling';pending.error=null;}
      render();
    }
    if(record&&retryable!==false)scheduleCreateStatus(record);
  }""",
          'neutral retryable create state')

          index = replace_once(index,
          """      const pending=state.materials.find((item)=>item.id===record.pendingId);
      if(data.status==='failed'&&pending){pending.syncStatus='error';pending.error='Создание не завершилось. Повторите нажатие.';render();}
    } catch(_error) {}
    finally { record.running=false; }
    if(pendingCreatePolls.has(record.requestId)&&(urgent||record.attempts<16))scheduleCreateStatus(record);""",
          """      const pending=state.materials.find((item)=>item.id===record.pendingId);
      if(data.status==='failed'&&pending){pending.syncStatus='reconciling';pending.error=null;render();}
    } catch(_error) {}
    finally { record.running=false; }
    if(pendingCreatePolls.has(record.requestId))scheduleCreateStatus(record);""",
          'persistent neutral status polling')

          index = replace_once(index,
          """        failOptimisticCreate(bridgeRequest.requestId,error.message);reply({ok:false,message:error.message,retryable:Boolean(error.retryable)});if(releaseReservation)announceEmbedBridgeReady();""",
          """        failOptimisticCreate(bridgeRequest.requestId,error.message,Boolean(error.retryable));reply({ok:false,message:error.message,retryable:Boolean(error.retryable)});if(releaseReservation)announceEmbedBridgeReady();""",
          'pass retryability into optimistic state')

          index_path.write_text(index)

          js_path = Path('apps-script-embed.js')
          js = js_path.read_text()

          js = replace_once(js,
          """  function completeCreateRequests(value) {
    const completed = safeCompletedCreateIds(value);
    ['Docs','Sheets','Slides'].forEach((section)=>{if(completed.has(rememberedCreateRequest(section)))forgetCreateRequest(section);});
    completed.forEach(removeOptimisticCreate);
    createRequests.forEach((record, section) => {
      if (!completed.has(record.requestId)) return;
      if (record.ackTimer) window.clearTimeout(record.ackTimer);
      createRequests.delete(section);forgetCreateRequest(section);
    });
  }""",
          """  function completeCreateRequests(value) {
    const completed = safeCompletedCreateIds(value);
    ['Docs','Sheets','Slides'].forEach((section)=>{if(completed.has(rememberedCreateRequest(section)))forgetCreateRequest(section);});
    completed.forEach(removeOptimisticCreate);
    createRequests.forEach((record, section) => {
      if (!completed.has(record.requestId)) return;
      if (record.ackTimer) window.clearTimeout(record.ackTimer);
      if (record.retryTimer) window.clearTimeout(record.retryTimer);
      record.retryTimer = 0;
      createRequests.delete(section);forgetCreateRequest(section);
    });
  }""",
          'clear background retry on completion')

          marker = """  function dispatchCreateAction(record) {
"""
          helper = """  function clearCreateRecovery(record) {
    if(!record)return;
    if(record.retryTimer)window.clearTimeout(record.retryTimer);
    record.retryTimer=0;
  }

  function scheduleCreateRecovery(record) {
    if(!record||record.retryTimer||createRequests.get(record.section)!==record)return false;
    const delays=[1500,3000,6000,12000,20000,30000];
    const attempt=Number(record.retryAttempts||0);
    record.retryTimer=window.setTimeout(()=>{
      record.retryTimer=0;
      if(createRequests.get(record.section)!==record)return;
      if(record.actionStarted){scheduleCreateRecovery(record);return;}
      record.retryAttempts=attempt+1;
      record.actionStarted=true;
      record.actionAcknowledged=false;
      record.ackAttempts=0;
      addOptimisticCreate(record);
      if(!dispatchCreateAction(record)){record.actionStarted=false;scheduleCreateRecovery(record);}
    },delays[Math.min(attempt,delays.length-1)]);
    return true;
  }

  function dispatchCreateAction(record) {
"""
          js = replace_once(js, marker, helper, 'background create retry helper')

          js = replace_once(js,
          """      record.actionStarted = false;
      record.lastNavigationAt = 0;
      removeOptimisticCreate(record.requestId);
      showNotice('Документ открыт, но фоновая привязка не подтверждена. Повторите нажатие — откроется тот же файл.');""",
          """      record.actionStarted = false;
      record.lastNavigationAt = 0;
      addOptimisticCreate(record);
      scheduleCreateRecovery(record);
      showNotice('Документ открыт. Фоновая привязка к Notion продолжается автоматически.');""",
          'lost acknowledgement background recovery')

          js = replace_once(js,
          """  function beginNativeCreate(record) {
    if (!record) return false;
    if (record.actionStarted) return true;
    record.actionStarted = true;""",
          """  function beginNativeCreate(record) {
    if (!record) return false;
    if (record.actionStarted) return true;
    clearCreateRecovery(record);
    record.actionStarted = true;""",
          'cancel queued retry on manual retry')

          old_handler = """    if (data.type === 'notion-widget-v20-primary-result' && validCreateRequestId(data.requestId) && data.ok === false) {
      const terminalSections = [];
      createRequests.forEach((record, section) => {
        if (record.requestId !== String(data.requestId).toLowerCase()) return;
        if (record.ackTimer) window.clearTimeout(record.ackTimer);
        removeOptimisticCreate(record.requestId);
        if (data.retryable === false) { createRequests.delete(section);forgetCreateRequest(section);terminalSections.push(section);return; }
        record.actionStarted = false;record.actionAcknowledged = false;record.lastNavigationAt = 0;record.ackTimer = 0;
      });
      if (terminalSections.length) terminalSections.forEach((section)=>interactionGrid.querySelectorAll(`[data-section=\"${section}\"]`).forEach((control)=>control.removeAttribute('href')));
      else refreshAllControlHrefs();
      showNotice(String(data.message || 'Файл не удалось создать. Повторите нажатие.').slice(0, 300));
      return;
    }"""
          new_handler = """    if (data.type === 'notion-widget-v20-primary-result' && validCreateRequestId(data.requestId) && data.ok === false) {
      const terminalSections = [];
      createRequests.forEach((record, section) => {
        if (record.requestId !== String(data.requestId).toLowerCase()) return;
        if (record.ackTimer) window.clearTimeout(record.ackTimer);
        record.ackTimer = 0;
        if (data.retryable === false) {
          clearCreateRecovery(record);removeOptimisticCreate(record.requestId);createRequests.delete(section);forgetCreateRequest(section);terminalSections.push(section);return;
        }
        record.actionStarted = false;record.actionAcknowledged = false;record.lastNavigationAt = 0;
        addOptimisticCreate(record);scheduleCreateRecovery(record);
      });
      if (terminalSections.length) terminalSections.forEach((section)=>interactionGrid.querySelectorAll(`[data-section=\"${section}\"]`).forEach((control)=>control.removeAttribute('href')));
      else refreshAllControlHrefs();
      showNotice(terminalSections.length?String(data.message || 'Файл не удалось создать. Повторите нажатие.').slice(0,300):'Документ открыт. Привязка к Notion завершается в фоне.');
      return;
    }"""
          js = replace_once(js, old_handler, new_handler, 'retryable primary result background recovery')

          js = replace_once(js,
          """    if (!optimisticCreateCards.has(record.requestId)) {
      optimisticCreateCards.set(record.requestId, { section: record.section, preparedName: record.preparedName, openUrl: record.href, navigateUntil: record.navigateUntil });
      renderSnapshotView(snapshotFingerprint(confirmedSnapshotRows));
    }
    return true;
  }

  function removeOptimisticCreate(requestId) {
    const removed = optimisticCreateCards.delete(String(requestId || '').toLowerCase());
    if (removed) renderSnapshotView(snapshotFingerprint(confirmedSnapshotRows));
    return removed;
  }""",
          """    if (!optimisticCreateCards.has(record.requestId)) {
      optimisticCreateCards.set(record.requestId, { section: record.section, preparedName: record.preparedName, openUrl: record.href, navigateUntil: record.navigateUntil });
      document.body.classList.add('outer-create-pending');
      renderSnapshotView(snapshotFingerprint(confirmedSnapshotRows));
    }
    return true;
  }

  function removeOptimisticCreate(requestId) {
    const removed = optimisticCreateCards.delete(String(requestId || '').toLowerCase());
    if (!optimisticCreateCards.size) document.body.classList.remove('outer-create-pending');
    if (removed) renderSnapshotView(snapshotFingerprint(confirmedSnapshotRows));
    return removed;
  }""",
          'keep neutral outer snapshot visible while reconciling')

          js_path.write_text(js)

          html_path = Path('apps-script-embed.html')
          html = html_path.read_text()
          match = re.search(r'<script id="earlyWidgetBootstrap">([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('early bootstrap script not found')
          old_script = match.group(1)
          old_hash = base64.b64encode(hashlib.sha256(old_script.encode()).digest()).decode()
          html = html.replace('apps-script-embed.js?v=55', 'apps-script-embed.js?v=56')
          html = replace_once(html,
              '.widget-action-ready:not(.outer-mutation-pending):not(.outer-menu-open) .snapshot-grid{opacity:0;visibility:hidden}',
              '.widget-action-ready:not(.outer-mutation-pending):not(.outer-menu-open):not(.outer-create-pending) .snapshot-grid{opacity:0;visibility:hidden}',
              'outer create snapshot visibility')
          match = re.search(r'<script id="earlyWidgetBootstrap">([\s\S]*?)</script>', html)
          new_script = match.group(1)
          new_hash = base64.b64encode(hashlib.sha256(new_script.encode()).digest()).decode()
          html = replace_once(html, f"'sha256-{old_hash}'", f"'sha256-{new_hash}'", 'early bootstrap CSP hash')
          html_path.write_text(html)

          embed_test = Path('widget-v20/tests/embed-wrapper.test.mjs')
          text = embed_test.read_text().replace('v=55', 'v=56')
          text += r'''

test('retryable create failures stay visible and recover in the background', () => {
  assert.match(wrapperJs, /function scheduleCreateRecovery\(record\)/);
  assert.match(wrapperJs, /const delays=\[1500,3000,6000,12000,20000,30000\]/);
  assert.match(wrapperJs, /addOptimisticCreate\(record\);scheduleCreateRecovery\(record\)/);
  assert.match(wrapperJs, /if \(data\.retryable === false\) \{[\s\S]*clearCreateRecovery\(record\);removeOptimisticCreate\(record\.requestId\)/);
  assert.match(wrapper, /\.widget-action-ready:not\(\.outer-mutation-pending\):not\(\.outer-menu-open\):not\(\.outer-create-pending\) \.snapshot-grid/);
});
'''
          embed_test.write_text(text)

          front_test = Path('widget-v20/tests/frontend-v20.test.mjs')
          text = front_test.read_text()
          text += r'''

test('new Google creates reconcile without a transient red error and watch Drive names quickly', () => {
  const create = frontend.slice(frontend.indexOf('function scheduleCreateStatus'), frontend.indexOf('async function createGoogleWithRecovery'));
  assert.match(create, /if\(!record\|\|record\.timer\)return/);
  assert.doesNotMatch(create, /attempts>=16/);
  assert.match(create, /pending\.syncStatus='reconciling'/);
  assert.match(create, /retryable===false/);
  assert.match(frontend, /function watchCreatedDriveMaterial\(material\)/);
  assert.match(frontend, /until:Date\.now\(\)\+90000/);
  assert.match(frontend, /const delays=\[500,900,1500,2500,4000,6500,10000,15000\]/);
  assert.match(frontend, /if\(material\)watchCreatedDriveMaterial\(material\)/);
});
'''
          front_test.write_text(text)
          PY
      - name: Run v20 regression suite
        run: cd widget-v20 && npm test
      - name: Commit tested hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@users.noreply.github.com'
          git add apps-script-embed.html apps-script-embed.js widget-v20/Index.html widget-v20/tests/embed-wrapper.test.mjs widget-v20/tests/frontend-v20.test.mjs
          git commit -m 'fix: reconcile Google creates without transient error state'
          git push origin HEAD:main
