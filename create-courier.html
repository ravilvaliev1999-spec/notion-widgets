<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action https://script.google.com https://*.googleusercontent.com; frame-ancestors 'none'; object-src 'none'">
  <title>Создание файла</title>
  <style>
    html,body{margin:0;min-height:100%;background:#191919;color:#e6e6e4;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;text-align:center}main{padding:24px}p{margin:0;max-width:380px}
    .runner{position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;border:0;opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <main><p id="status" role="status" aria-live="polite">Создаю файл…</p></main>
  <iframe id="runner" name="createRunner" class="runner" title="Защищённое создание файла" credentialless referrerpolicy="no-referrer"></iframe>
  <script>
  (()=>{
    'use strict';
    const TIMEOUT_MS=180000;
    const status=document.getElementById('status');
    const runner=document.getElementById('runner');
    let expectedRequestId='';

    function fail(message){status.textContent=String(message||'Не удалось создать файл.').slice(0,500);runner.remove();}

    function isRunnerDescendant(source){
      const root=runner.contentWindow;if(!root||!source)return false;
      const visit=(target,depth)=>{
        if(target===source)return true;if(depth>=4)return false;
        let length=0;try{length=Math.min(Number(target.length)||0,8);}catch(_error){return false;}
        for(let index=0;index<length;index+=1){try{if(visit(target.frames[index],depth+1))return true;}catch(_error){}}
        return false;
      };
      return visit(root,0);
    }

    function decodeFragment(hash){
      const match=/^#v1=([A-Za-z0-9_-]{80,6000})$/.exec(String(hash||''));
      if(!match)throw new Error('Ссылка на создание повреждена.');
      const encoded=match[1],padding='='.repeat((4-encoded.length%4)%4);
      let binary;
      try{binary=atob(encoded.replace(/-/g,'+').replace(/_/g,'/')+padding);}catch(_error){throw new Error('Ссылка на создание повреждена.');}
      const bytes=new Uint8Array(binary.length);
      for(let index=0;index<binary.length;index+=1)bytes[index]=binary.charCodeAt(index);
      try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(_error){throw new Error('Ссылка на создание повреждена.');}
    }

    function validateServiceUrl(raw){
      if(typeof raw!=='string'||raw.length>4500)throw new Error('Ссылка на создание слишком длинная.');
      const url=new URL(raw);
      if(url.protocol!=='https:'||url.hostname!=='script.google.com'||url.port||url.username||url.password||url.hash||!/^\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(url.pathname))throw new Error('Адрес сервиса создания недопустим.');
      const entries=Array.from(url.searchParams.entries()),allowed=new Set(['task','accessToken','createSection','createRequestId']);
      if(entries.length!==4||entries.some(([key])=>!allowed.has(key))||new Set(entries.map(([key])=>key)).size!==4)throw new Error('Параметры создания повреждены.');
      const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if(!uuid.test(url.searchParams.get('task')||'')||!uuid.test(url.searchParams.get('createRequestId')||'')||!/^[A-Za-z0-9._~-]{32,256}$/.test(url.searchParams.get('accessToken')||'')||!['Docs','Sheets','Slides'].includes(url.searchParams.get('createSection')||''))throw new Error('Параметры создания повреждены.');
      return {
        action:url.origin+url.pathname,
        fields:{
          task:url.searchParams.get('task'),
          accessToken:url.searchParams.get('accessToken'),
          createSection:url.searchParams.get('createSection'),
          createRequestId:url.searchParams.get('createRequestId')
        }
      };
    }

    function submitCreate(request){
      const keys=['task','accessToken','createSection','createRequestId'];
      if(!request||typeof request.action!=='string'||!request.fields||Object.keys(request.fields).length!==4)throw new Error('Параметры создания повреждены.');
      const action=new URL(request.action);
      if(action.protocol!=='https:'||action.hostname!=='script.google.com'||action.port||action.username||action.password||action.search||action.hash||!/^\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(action.pathname))throw new Error('Адрес сервиса создания недопустим.');
      const form=document.createElement('form');
      form.method='post';form.action=action.href;form.target='createRunner';form.enctype='application/x-www-form-urlencoded';form.acceptCharset='UTF-8';form.hidden=true;
      keys.forEach((key)=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=String(request.fields[key]||'');form.appendChild(input);});
      document.body.appendChild(form);form.submit();
      window.setTimeout(()=>{form.querySelectorAll('input').forEach((input)=>{input.value='';});form.remove();},0);
    }

    function allowedOpenUrl(value){
      const url=new URL(String(value||''));
      if(url.protocol!=='https:'||url.port||url.username||url.password||(url.hostname!=='docs.google.com'&&url.hostname!=='drive.google.com'))throw new Error('Сервис вернул недопустимый адрес файла.');
      return url.href;
    }

    try{
      if(location.protocol!=='https:'||location.hostname!=='ravilvaliev1999-spec.github.io'||location.pathname!=='/notion-widgets/create-courier.html'||location.search)throw new Error('Недопустимый адрес страницы.');
      const fragment=location.hash;
      history.replaceState(null,'',location.pathname);
      try{window.opener=null;}catch(_error){}
      const request=validateServiceUrl(decodeFragment(fragment));
      expectedRequestId=request.fields.createRequestId||'';
      runner.setAttribute('credentialless','');runner.credentialless=true;submitCreate(request);
      window.setTimeout(()=>fail('Сервис не ответил. Закройте эту вкладку и повторите нажатие.'),TIMEOUT_MS);
    }catch(error){
      try{history.replaceState(null,'',location.pathname);}catch(_error){}
      fail(error&&error.message||'Не удалось начать создание.');
    }

    window.addEventListener('message',(event)=>{
      if(!isRunnerDescendant(event.source))return;
      if(event.origin!=='null'&&!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(event.origin))return;
      const data=event.data;
      if(!data||data.type!=='notion-widget-v20-create'||data.requestId!==expectedRequestId)return;
      if(data.status==='success'){
        try{status.textContent='Файл создан. Открываю…';location.replace(allowedOpenUrl(data.openUrl));}
        catch(error){fail(error&&error.message||'Не удалось открыть файл.');}
      } else if(data.status==='pending'){
        status.textContent=String(data.message||'Файл уже создаётся в первой вкладке.').slice(0,500);
        window.setTimeout(()=>{try{window.close();}catch(_error){}},2500);
      } else if(data.status==='error') fail(data.message||'Файл не удалось создать.');
    });
  })();
  </script>
</body>
</html>
