<!doctype html>
<html lang="ru">
<head>
  <base target="_self">
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta id="runtimeParams" data-params="<?= runtimeParamsJson ?>">
  <meta id="precomputedResult" data-result="<?= precomputedResultJson ?>">
  <title>Создание файла</title>
  <style>
    html,body{margin:0;min-height:100%;background:#191919;color:#e6e6e4;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;text-align:center}main{padding:24px}p{margin:0;max-width:360px}
  </style>
</head>
<body>
  <main><p id="status" role="status" aria-live="polite">Создаю файл…</p></main>
  <script>
  (()=>{
    'use strict';
    const status=document.getElementById('status');
    let requestId='';

    function notify(result,message,openUrl){
      const payload={type:'notion-widget-v20-create',requestId,status:result};
      if(message)payload.message=String(message).slice(0,500);
      if(openUrl)payload.openUrl=openUrl;
      try{if(window.top&&window.top!==window)window.top.postMessage(payload,'*');}catch(_error){}
    }

    function runtimeParams(){
      const meta=document.getElementById('runtimeParams');
      try{return JSON.parse(meta&&meta.dataset&&meta.dataset.params||'{}');}
      catch(_error){throw new Error('Параметры создания повреждены.');}
    }

    function precomputedResult(){
      const meta=document.getElementById('precomputedResult');
      let value;
      try{value=JSON.parse(meta&&meta.dataset&&meta.dataset.result||'null');}
      catch(_error){throw new Error('Результат создания повреждён.');}
      if(value===null)return null;
      if(!value||typeof value!=='object'||Array.isArray(value))throw new Error('Результат создания повреждён.');
      const keys=Object.keys(value).sort(),success=value.status==='success',pending=value.status==='pending';
      const expected=success?['openUrl','requestId','status']:['message','requestId','status'];
      if(keys.length!==3||keys.some((key,index)=>key!==expected[index])||(!success&&!pending&&value.status!=='error'))throw new Error('Результат создания повреждён.');
      return value;
    }

    function allowedOpenUrl(value){
      try{
        const url=new URL(String(value||''));
        if(url.protocol!=='https:'||url.port||url.username||url.password||
          (url.hostname!=='docs.google.com'&&url.hostname!=='drive.google.com'))return '';
        return url.href;
      }catch(_error){return '';}
    }

    function callCreate(input){
      return new Promise((resolve,reject)=>{
        const runtime=window.google&&google.script&&google.script.run;
        if(!runtime){reject(new Error('Нет связи с сервисом создания.'));return;}
        runtime.withSuccessHandler(resolve).withFailureHandler((error)=>reject(new Error(error&&error.message||'Нет связи с сервисом создания.'))).apiCreateGoogle(input);
      });
    }

    async function start(){
      try{
        const prepared=precomputedResult();
        if(prepared){
          requestId=String(prepared.requestId||'').toLowerCase();
          if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(requestId))throw new Error('Результат создания повреждён.');
          if(prepared.status==='pending'){
            const message=String(prepared.message||'Файл уже создаётся в первой вкладке.').slice(0,500);
            status.textContent=message;notify('pending',message,'');return;
          }
          if(prepared.status==='error')throw new Error(String(prepared.message||'Файл не удалось создать.').slice(0,500));
          const readyUrl=allowedOpenUrl(prepared.openUrl);
          if(!readyUrl)throw new Error('Сервис вернул недопустимый адрес файла.');
          status.textContent='Файл создан. Открываю…';notify('success','',readyUrl);return;
        }
        const params=runtimeParams();
        const taskPageId=String(params.task||params.taskPageId||'').toLowerCase();
        const accessToken=String(params.accessToken||'');
        const section=String(params.createSection||'');
        requestId=String(params.createRequestId||'').toLowerCase();
        const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        if(!uuid.test(taskPageId)||!uuid.test(requestId)||!/^[A-Za-z0-9._~-]{32,256}$/.test(accessToken)||!['Docs','Sheets','Slides'].includes(section))throw new Error('Параметры создания повреждены.');
        const response=await callCreate({taskPageId,accessToken,section,idempotencyKey:requestId});
        if(!response||!response.ok)throw new Error(response&&response.error&&response.error.message||'Файл не удалось создать.');
        const openUrl=allowedOpenUrl(response.data&&response.data.material&&response.data.material.openUrl);
        if(!openUrl)throw new Error('Сервис вернул недопустимый адрес файла.');
        status.textContent='Файл создан. Открываю…';
        notify('success','',openUrl);
      }catch(error){
        const message=error&&error.message||'Файл не удалось создать.';
        status.textContent=message;notify('error',message,'');
      }
    }

    start();
  })();
  </script>
</body>
</html>
