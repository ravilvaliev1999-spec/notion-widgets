<meta name="color-scheme" content="dark" />
<meta id="initialBootstrap" data-bootstrap="<?= initialBootstrapJson ?>" />
<meta id="runtimeParams" data-params="<?= runtimeParamsJson ?>" />
<script>
  (()=>{
    try{
      const runtimeMeta=document.getElementById('runtimeParams');
      const runtime=JSON.parse(String(runtimeMeta&&runtimeMeta.dataset&&runtimeMeta.dataset.params||'{}'));
      const nonce=String(runtime.embedNonce||new URLSearchParams(location.search).get('embedNonce')||'');
      if(!/^[0-9a-f]{32}$/.test(nonce))return;
      const meta=document.getElementById('initialBootstrap');
      const bootstrap=JSON.parse(String(meta&&meta.dataset&&meta.dataset.bootstrap||'null'));
      if(!bootstrap||bootstrap.cached!==true||bootstrap.authoritative!==false||!Array.isArray(bootstrap.materials))return;
      const sections=['Drive','Docs','Sheets','Slides'],materials=[];
      for(const item of bootstrap.materials){
        if(materials.length>=100)break;
        const section=String(item&&item.section||''),name=String(item&&item.name||'').replace(/\s+/g,' ').trim(),format=String(item&&item.format||'').replace(/\s+/g,' ').trim(),position=Number(item&&item.position),navigationBinding=String(item&&item.navigationBinding||'').toLowerCase();
        if(!sections.includes(section)||!name||name.length>180||format.length>100||!Number.isFinite(position)||position<0||position>10000||item.archived===true||String(item.id||'').startsWith('pending:')||['pending','deleting','deleted'].includes(String(item.syncStatus||'')))continue;
        const material={name,section,format:format||'Файл',position:Math.round(position)};if(/^[a-f0-9]{64}$/.test(navigationBinding))material.navigationBinding=navigationBinding;materials.push(material);
      }
      let ancestor=window.parent;
      for(let depth=0;depth<5;depth+=1){
        try{ancestor.postMessage({type:'notion-widget-v20-snapshot-ready',embedNonce:nonce,materials},'https://ravilvaliev1999-spec.github.io');}catch(_error){}
        let next;
        try{next=ancestor.parent;}catch(_error){return;}
        if(!next||next===ancestor)return;
        ancestor=next;
      }
    }catch(_error){}
  })();
</script>

      pollDriveMetadata(true,new Set(urgentDriveTargets)).catch(()=>{scheduleUrgentDriveRetry();});

  async function drainUrgentDrivePolls() {
    const attempted=new Set();
    const authoritativelyRetried=new Set();
    let refreshed=false;
    let needsRetry=false;
    const refreshUnconfirmed=async(unconfirmed)=>{
      if(!unconfirmed.size)return true;
      const requiresRefresh=Array.from(unconfirmed).some((id)=>!authoritativelyRetried.has(id));
      if(!requiresRefresh){
        unconfirmed.forEach((id)=>{urgentDriveTargets.delete(id);recentDrivePageIds.delete(id);});
        return true;
      }
      state.claimRefreshNotBefore=Date.now()+5*60*1000;
      const didRefresh=await refresh(true);
      if(!didRefresh){state.claimRefreshNotBefore=Date.now()+1000;needsRetry=true;return false;}
      refreshed=true;pruneDrivePollTargets();
      unconfirmed.forEach((id)=>{
        if(!urgentDriveTargets.has(id))return;
        authoritativelyRetried.add(id);attempted.delete(id);
      });
      return true;
    };
    state.urgentDrivePolling=true;
    try {
      while(taskPageId&&state.bootstrapped&&!state.busy.size) {
        const batch=new Set(Array.from(urgentDriveTargets).filter((id)=>!attempted.has(id)));
        if(!batch.size)break;
        batch.forEach((id)=>attempted.add(id));
        const materials=drivePollCoordinates(batch);
        const submitted=new Set(materials.map((item)=>normalizeUuid(item.pageId)).filter(Boolean));
        const known=new Set(state.materials.map((item)=>normalizeUuid(item&&item.id)).filter(Boolean));
        batch.forEach((id)=>{if(!submitted.has(id)&&!known.has(id)){urgentDriveTargets.delete(id);recentDrivePageIds.delete(id);}});
        if(!materials.length){
          const unconfirmed=new Set(Array.from(batch).filter((id)=>urgentDriveTargets.has(id)&&known.has(id)));
          if(!await refreshUnconfirmed(unconfirmed))break;
          continue;
        }
        let data;
        try { data=await call('apiPollDriveMetadata',{taskPageId,materials}); }
        catch(_error) { needsRetry=true;break; }
        urgentDriveRetryDelay=250;
        applyDriveMetadata(data.materials);
        const confirmed=drivePollResultPageIds(data.materials);
        confirmed.forEach((id)=>{urgentDriveTargets.delete(id);recentDrivePageIds.delete(id);});
        const unconfirmed=new Set(Array.from(batch).filter((id)=>urgentDriveTargets.has(id)&&!confirmed.has(id)));
        if(!await refreshUnconfirmed(unconfirmed))break;
      }
    } finally {
      state.urgentDrivePolling=false;
      if(urgentDriveTargets.size&&(needsRetry||state.busy.size))scheduleUrgentDriveRetry();
    }
    return {refreshed};
  }

  async function pollDriveMetadata(urgent,onlyPageIds) {
    const now=Date.now(),targets=new Set(Array.from(onlyPageIds||[]).map(normalizeUuid).filter(Boolean));
    if(urgent&&targets.size)targets.forEach((id)=>urgentDriveTargets.add(id));
    if(!taskPageId||!state.bootstrapped||!state.authoritative)return;
    if(urgent) {
      if(!targets.size)drivePollCoordinates().forEach((item)=>urgentDriveTargets.add(item.pageId));
      if(state.busy.size){scheduleUrgentDriveRetry();return {refreshed:false};}
      if(!urgentDriveTargets.size)return {refreshed:false};
      if(!urgentDrivePromise)urgentDrivePromise=drainUrgentDrivePolls().finally(()=>{urgentDrivePromise=null;});
      return urgentDrivePromise;
    }
    if(state.busy.size)return;
    if(state.drivePolling||state.syncing||now-state.lastDrivePollAt<DRIVE_POLL_MIN_GAP_MS)return;
    const materials=drivePollCoordinates(targets);
    if(!materials.length)return;
    state.lastDrivePollAt=now;state.drivePolling=true;
    try {
      const data=await callBackground('apiPollDriveMetadata',{taskPageId,materials});applyDriveMetadata(data.materials);
      if(data.refreshRequired&&Date.now()>=state.claimRefreshNotBefore){state.claimRefreshNotBefore=Date.now()+5*60*1000;await refresh(true);}
    }
    catch(_error) {}
    finally { state.drivePolling=false; }
  }

  function scheduleCreateStatus(record,requestedDelay) {

    const attempt=Math.max(0,Number(record.attempts)||0);
    const naturalDelay=attempt<CREATE_STATUS_FAST_DELAYS_MS.length?CREATE_STATUS_FAST_DELAYS_MS[attempt]:CREATE_STATUS_SLOW_DELAY_MS;
    const requested=Number(requestedDelay),delay=Number.isFinite(requested)?Math.max(0,requested):naturalDelay;
    record.timer=window.setTimeout(()=>{record.timer=0;pollCreateStatus(record.requestId,false);},delay);

    if(pending.syncStatus!=='waiting'){pending.syncStatus='waiting';changed=true;}

  function nextCreateRecoveryDelay(record) {

    return now>=record.recoveryNotBefore;

      state.materials.push({id:record.pendingId,name:preparedForSection&&preparedForSection.preparedName||pendingCreateName(section),section,format:section==='Docs'?'Google Docs':section==='Sheets'?'Google Sheets':'Google Slides',provider:'Google Drive',openUrl:preparedForSection&&preparedForSection.openUrl||'',position:activeMaterials(section).length,syncStatus:'waiting',widgetOwned:true,createRequestId:normalized});

  function failOptimisticCreate(requestId,message,retryable) {
    const record=pendingCreatePolls.get(String(requestId||'').toLowerCase()),pending=record&&state.materials.find((item)=>item.id===record.pendingId);
    if(!record)return;
    if(retryable!==false){

  function repairCreatedFileMarker(record,attempt) {

      .then((data)=>{if(!(data&&data.repaired))window.setTimeout(()=>repairCreatedFileMarker(record,index+1),delays[index]);})

  async function retryPendingCreate(record) {
    if(!record||record.recovering||record.terminal||!pendingCreatePolls.has(record.requestId)||!deferCreateRecovery(record))return false;
    const payload=pendingCreatePayload(record);
    if(!payload)return false;
    record.recovering=true;record.recoveryAttempts+=1;
    try {
      const data=await call('apiCreateGoogle',payload);
      if(data&&data.material){
        const consumed=consumePreparedCreate(record.section,record.requestId);
        completeOptimisticCreate(record.requestId,data.material,true);
        if(consumed)window.setTimeout(()=>warmPreparedCreates(),0);
        return true;
      }
    } catch(error) {
      if(error&&error.retryable===false){failOptimisticCreate(record.requestId,error.message,false);return false;}
      setOptimisticCreateWaiting(record);
    } finally { record.recovering=false; }
    record.recoveryNotBefore=Date.now()+nextCreateRecoveryDelay(record);
    return false;
  }

  async function pollCreateStatus(requestId,urgent) {
    const record=pendingCreatePolls.get(String(requestId||'').toLowerCase());
    if(!record||record.running||record.terminal)return;
    if(record.timer){clearTimeout(record.timer);record.timer=0;}
    record.running=true;record.attempts+=1;
    try {
      const data=await call('apiGetCreateStatus',{taskPageId,section:record.section,createRequestId:record.requestId});
      if(data.status==='done'&&data.material){
        completeOptimisticCreate(record.requestId,data.material,true);
        repairCreatedFileMarker(record,0);return;
      }
      if(data.status==='failed'&&data.retryable===false){failOptimisticCreate(record.requestId,'Создание не завершилось. Повторите нажатие.',false);return;}
      if(data.status==='drive_ready')setOptimisticCreateWaiting(record,data.openUrl);
      else setOptimisticCreateWaiting(record);
      if(data.status==='failed'||data.status==='missing'||data.status==='drive_ready')await retryPendingCreate(record);
    } catch(error) {
      if(error&&error.retryable===false)failOptimisticCreate(record.requestId,error.message,false);
      else setOptimisticCreateWaiting(record);
    }
    finally { record.running=false; }
    if(pendingCreatePolls.has(record.requestId)&&!record.terminal)scheduleCreateStatus(record);
  }

  async function createGoogleWithRecovery(payload) {
    const delays=[0,900,2400];let lastError=null;
    for(const delay of delays){
      if(delay)await new Promise((resolve)=>window.setTimeout(resolve,delay));
      try{return await call('apiCreateGoogle',payload);}
      catch(error){lastError=error;if(error&&error.retryable===false)throw error;}
    }
    throw lastError||new Error('Файл не удалось завершить.');
  }

  async function createGoogle(section,bridgeRequest) {
    const reply=(payload)=>{if(bridgeRequest)replyToEmbedBridge(bridgeRequest.source,bridgeRequest.origin,Object.assign({type:'notion-widget-v20-primary-result',requestId:bridgeRequest.requestId},payload));};
    if(state.actionReady!==true){toast('Завершаю синхронизацию…');reply({ok:false,message:'Создание ещё подготавливается. Повторите нажатие.',retryable:true});return;}
    if(state.busy.has(`create:${section}`)){reply({ok:false,message:'Создание этого файла уже выполняется.',retryable:true});return;}
    const popup=bridgeRequest?null:window.open('about:blank','_blank');
    if(popup)writeCourier(popup,'Создаю файл…');
    const operation=bridgeRequest?{value:bridgeRequest.requestId}:stableIdempotency('create-google',section);
    const prepared=bridgeRequest&&bridgeRequest.reservation||(!bridgeRequest&&state.preparedCreates[section]);
    state.busy.add(`create:${section}`);render();
    if(bridgeRequest)startOptimisticCreate(section,bridgeRequest.requestId,false,prepared);
    let releaseReservation=false;
    try {
      const payload={taskPageId,section,idempotencyKey:operation.value};
      if(prepared){payload.reservationId=prepared.reservationId;if(Number.isSafeInteger(prepared.generation))Object.assign(payload,{openUrl:prepared.openUrl,preparedName:prepared.preparedName,generation:prepared.generation,navigateUntil:prepared.navigateUntil,reservationProof:prepared.reservationProof});}
      const data=await createGoogleWithRecovery(payload);
      if(bridgeRequest){
        if(bridgeRequest.reservationId){releaseReservation=true;consumePreparedCreate(section,bridgeRequest.reservationId);}
        completeOptimisticCreate(bridgeRequest.requestId,data.material,false);reply({ok:true,openUrl:data.material&&data.material.openUrl||''});announceEmbedBridgeReady();
      }
      else {
        clearIdempotency(operation);upsert(data.material);render();
        if(data.material&&data.material.openUrl){if(popup&&!popup.closed){try{popup.opener=null;}catch(_error){}popup.location.replace(data.material.openUrl);}else window.open(data.material.openUrl,'_blank','noopener,noreferrer');}
        else if(popup&&!popup.closed)popup.close();
      }
      toast(data.duplicate?'Файл уже был создан':'Файл создан и сохранён как знание');
    } catch(error) {
      if(bridgeRequest){
        const retryable=!error||error.retryable!==false;
        if(bridgeRequest.reservationId&&!retryable){releaseReservation=true;consumePreparedCreate(section,bridgeRequest.reservationId);}
        failOptimisticCreate(bridgeRequest.requestId,error&&error.message,retryable);reply({ok:false,message:error&&error.message,retryable});if(releaseReservation)announceEmbedBridgeReady();
      }
      else {if(popup&&!popup.closed)popup.close();showFatal(error.message,Boolean(error.retryable));}
    }
    finally {
      state.busy.delete(`create:${section}`);render();resumeDeferredDownloadPrime();
      if(releaseReservation)window.setTimeout(()=>warmPreparedCreates(),0);
    }
  }

  function isBoundedAncestor(source) {
    let ancestor=window.parent;
    for(let depth=0;depth<5;depth+=1){
      if(source===ancestor)return true;
      let next;
      try{next=ancestor.parent;}catch(_error){return false;}
      if(!next||next===ancestor)return false;
      ancestor=next;
    }
    return false;
  }

})();
</script>
