      return {
        current:{schema:SCHEMA,key,slot:`notion-widget-preview-v2:${encode(new Uint8Array(slotDigest).slice(0,18))}`,aad:encoder.encode(`notion-widget-preview-v2\u0000${runtime.task}`)},
        legacy:{schema:LEGACY_SCHEMA,key:legacyKey,slot:`notion-widget-preview-v1:${encode(new Uint8Array(legacySlotDigest).slice(0,18))}`,aad:encoder.encode(`notion-widget-preview-v1\u0000${runtime.task}\u0000${runtime.release}`)}
      };
    }

    async function read(store,cache,removeAuthenticationFailure) {
      let raw='';
      try{raw=String(store.getItem(cache.slot)||'');}catch(_error){return {status:'unavailable'};}
      if(!raw)return {status:'missing'};
      let parsed;
      try{parsed=envelope(raw,cache.schema,Date.now());}
      catch(_error){try{store.removeItem(cache.slot);}catch(_removeError){}return {status:'invalid'};}
      let plaintext;
      try{plaintext=await window.crypto.subtle.decrypt({name:'AES-GCM',iv:parsed.iv,additionalData:cache.aad},cache.key,parsed.ciphertext);}
      catch(_error){if(removeAuthenticationFailure){try{store.removeItem(cache.slot);}catch(_removeError){}}return {status:'authentication-failed'};}
      try {
        const payload=JSON.parse(new TextDecoder().decode(plaintext));
        if(!exact(payload,['schema','savedAt','materials'])||payload.schema!==cache.schema||payload.savedAt!==parsed.value.savedAt||!validTime(payload.savedAt,Date.now()))throw new Error('INVALID_PAYLOAD');
        const materials=rows(payload.materials);
        if(!materials)throw new Error('INVALID_MATERIALS');
        return {status:'valid',materials,savedAt:payload.savedAt};
      } catch(_error) {
        try{store.removeItem(cache.slot);}catch(_removeError){}
        return {status:'invalid'};
      }
    }

    async function migrate(store,cache,entry) {
      try {
        const iv=new Uint8Array(12);
        window.crypto.getRandomValues(iv);
        const plaintext=new TextEncoder().encode(JSON.stringify({schema:cache.current.schema,savedAt:entry.savedAt,materials:entry.materials}));
        const ciphertext=new Uint8Array(await window.crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:cache.current.aad},cache.current.key,plaintext));
        if(window.__notionWidgetLiveSnapshotSeen===true||window.__notionWidgetSnapshotRuntimeOwned===true)return false;
        if(String(store.getItem(cache.current.slot)||''))return false;
        const serialized=JSON.stringify({schema:cache.current.schema,savedAt:entry.savedAt,iv:encode(iv),ciphertext:encode(ciphertext)});
        store.setItem(cache.current.slot,serialized);
        if(String(store.getItem(cache.current.slot)||'')!==serialized)return false;
        try{store.removeItem(cache.legacy.slot);}catch(_removeError){}
        return true;
      } catch(_error) {return false;}
    }

    function render(materials) {
      const grid=document.getElementById('snapshotGrid');
      if(!grid||window.__notionWidgetLiveSnapshotSeen===true||window.__notionWidgetSnapshotRuntimeOwned===true)return false;
      const fragment=document.createDocumentFragment();
      for(const section of SECTIONS) {
        const sectionRows=materials.filter((row)=>row.section===section);
        const column=document.createElement('section');
        column.className='snapshot-column';
        column.dataset.snapshotColumn=section;
        const source=document.querySelector(`[data-snapshot-section="${section}"]`);
        const icon=source&&source.querySelector('.skeleton-icon');
        if(source) {
          const top=source.cloneNode(true);
          top.classList.add('snapshot-top');
          const count=top.querySelector('.skeleton-count');
          if(count)count.textContent=String(sectionRows.length);
          column.appendChild(top);
        }
        for(const row of sectionRows) {
          const card=document.createElement('article');
          card.className=`snapshot-card ${COLORS[section]}`;
          if(icon)card.appendChild(icon.cloneNode(true));
          const meta=document.createElement('span');
          meta.className='skeleton-meta';
          const title=document.createElement('span');
          title.className='skeleton-title';
          title.textContent=row.name;
          const sub=document.createElement('span');
          sub.className='skeleton-sub';
          sub.textContent=row.format;
          meta.append(title,sub);
          card.appendChild(meta);
          column.appendChild(card);
        }
        fragment.appendChild(column);
      }
      if(window.__notionWidgetLiveSnapshotSeen===true||window.__notionWidgetSnapshotRuntimeOwned===true)return false;
      grid.replaceChildren(fragment);
      grid.hidden=false;
      document.body.classList.add('snapshot-ready');
      return true;
    }

    async function restore() {
      const runtime=params();
      if(!runtime||!window.crypto||!window.crypto.subtle)return false;
      let store;
      try{store=window.localStorage;}catch(_error){return false;}
      const cache=await context(runtime);
      const current=await read(store,cache.current,true);
      if(current.status==='valid')return render(current.materials);
      const legacy=await read(store,cache.legacy,false);
      if(legacy.status!=='valid')return false;
      const rendered=render(legacy.materials);
      await migrate(store,cache,legacy);
      return rendered;
    }

    return restore();
  })();
  </script>
</body>
